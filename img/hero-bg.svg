<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="clouds" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0045 0.011" numOctaves="5" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.47  0 0 0 0 0.68  0 0 0 1.9 -0.78"/>
    </filter>
    <filter id="clouds2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.008" numOctaves="4" seed="3"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.20  0 0 0 0 0.30  0 0 0 0 0.52  0 0 0 1.7 -0.62"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03050b"/>
      <stop offset="0.55" stop-color="#070d1d"/>
      <stop offset="1" stop-color="#0a1530"/>
    </linearGradient>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1600" height="900" fill="url(#fadeTop)"/></mask>
    <radialGradient id="glowL" cx="18%" cy="30%" r="55%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="86%" cy="72%" r="50%">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="50%" cy="108%" r="45%">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g mask="url(#m)">
    <rect width="1600" height="900" filter="url(#clouds2)" opacity="0.9"/>
    <rect width="1600" height="900" filter="url(#clouds)" opacity="0.55"/>
  </g>
  <rect width="1600" height="900" fill="url(#glowL)"/>
  <rect width="1600" height="900" fill="url(#glowR)"/>
  <rect width="1600" height="900" fill="url(#gold)"/>
</svg>
